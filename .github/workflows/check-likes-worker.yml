name: Check optional likes API
on:
  push:
    branches: [main]
    paths:
      - 'server/likes-worker/**'
      - '.github/workflows/check-likes-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/likes-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
