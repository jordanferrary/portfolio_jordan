name: Deploy React to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:studio
      - name: Verify Alquimago release
        run: node scripts/check-alquimago-release.mjs
      - name: Prepare social preview and favicon from published content
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/build_site_identity.py
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_ALQUIMAGO_AUTH_ORIGIN: ${{ vars.ALQUIMAGO_AUTH_ORIGIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
